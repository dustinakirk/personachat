{# Reusable persona drawer component for selecting personas #}
{# Usage: Include this in your template and call openPersonaSelectorDrawer() #}

<!-- Backdrop overlay -->
<div id="personaSelectorDrawerBackdrop" class="selector-drawer-backdrop" onclick="closePersonaSelectorDrawer()"></div>

<!-- Drawer panel -->
<div id="personaSelectorDrawer" class="persona-selector-drawer">
  <div class="selector-drawer-header">
    <h3>Add Personas</h3>
    <button type="button" class="btn-close" onclick="closePersonaSelectorDrawer()" aria-label="Close">×</button>
  </div>

  <div class="selector-drawer-search">
    <input
      type="text"
      id="personaSelectorDrawerSearch"
      placeholder="Search personas by name or role..."
      class="search-input"
      autocomplete="off"
    >
  </div>

  <div class="selector-drawer-content">
    <div id="personaSelectorDrawerList" class="persona-list">
      <!-- Personas will be loaded here dynamically -->
      <div class="loading-state">Loading personas...</div>
    </div>
  </div>

  <div class="selector-drawer-footer">
    <button type="button" class="btn-secondary" onclick="closePersonaSelectorDrawer()">Close</button>
    <button type="button" class="btn" onclick="addSelectedPersonas()">Add Selected</button>
  </div>
</div>

<script>
// Drawer state
let allPersonas = [];
let selectedPersonaIds = new Set();
let existingPersonaIds = new Set();

// Open drawer and load personas
function openPersonaSelectorDrawer() {
  const backdrop = document.getElementById('personaSelectorDrawerBackdrop');
  const drawer = document.getElementById('personaSelectorDrawer');

  backdrop.classList.add('active');
  drawer.classList.add('active');

  // Load personas if not already loaded
  if (allPersonas.length === 0) {
    loadPersonasForDrawer();
  }

  // Focus search input
  setTimeout(() => {
    document.getElementById('personaSelectorDrawerSearch').focus();
  }, 100);
}

// Close drawer
function closePersonaSelectorDrawer() {
  const backdrop = document.getElementById('personaSelectorDrawerBackdrop');
  const drawer = document.getElementById('personaSelectorDrawer');

  backdrop.classList.remove('active');
  drawer.classList.remove('active');

  // Clear search
  document.getElementById('personaSelectorDrawerSearch').value = '';
}

// Load personas from API
async function loadPersonasForDrawer() {
  const listContainer = document.getElementById('personaSelectorDrawerList');

  try {
    const response = await fetch('/personas/api/list');
    const data = await response.json();

    if (data.success) {
      allPersonas = data.personas || [];
      renderPersonaList(allPersonas);
    } else {
      listContainer.innerHTML = '<div class="error-state">Failed to load personas</div>';
    }
  } catch (error) {
    console.error('Error loading personas:', error);
    listContainer.innerHTML = '<div class="error-state">Error loading personas</div>';
  }
}

// Render persona list
function renderPersonaList(personas) {
  const listContainer = document.getElementById('personaSelectorDrawerList');

  if (personas.length === 0) {
    listContainer.innerHTML = '<div class="empty-state">No personas found</div>';
    return;
  }

  listContainer.innerHTML = personas.map(persona => {
    const isExisting = existingPersonaIds.has(persona.id);
    const isSelected = selectedPersonaIds.has(persona.id);
    const disabledClass = isExisting ? 'disabled' : '';
    const checkedAttr = isSelected ? 'checked' : '';
    const disabledAttr = isExisting ? 'disabled' : '';

    return `
      <div class="persona-list-item ${disabledClass}" onclick="togglePersonaSelection('${persona.id}', ${isExisting})">
        <input
          type="checkbox"
          id="persona-${persona.id}"
          value="${persona.id}"
          ${checkedAttr}
          ${disabledAttr}
          onclick="event.stopPropagation()"
          onchange="handleCheckboxChange('${persona.id}')"
        >
        <label for="persona-${persona.id}" class="persona-info">
          <div class="persona-name">${escapeHtml(persona.name)}</div>
          <div class="persona-role">${escapeHtml(persona.role || '')}${persona.company ? ' · ' + escapeHtml(persona.company) : ''}</div>
        </label>
      </div>
    `;
  }).join('');
}

// Toggle persona selection by clicking anywhere on the item
function togglePersonaSelection(personaId, isDisabled) {
  if (isDisabled) return;

  const checkbox = document.getElementById(`persona-${personaId}`);
  if (checkbox) {
    checkbox.checked = !checkbox.checked;
    handleCheckboxChange(personaId);
  }
}

// Handle checkbox change
function handleCheckboxChange(personaId) {
  const checkbox = document.getElementById(`persona-${personaId}`);

  if (checkbox.checked) {
    selectedPersonaIds.add(personaId);
  } else {
    selectedPersonaIds.delete(personaId);
  }
}

// Filter personas as user types
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('personaSelectorDrawerSearch');

  if (searchInput) {
    searchInput.addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase().trim();

      if (!query) {
        renderPersonaList(allPersonas);
        return;
      }

      const filtered = allPersonas.filter(persona => {
        const name = (persona.name || '').toLowerCase();
        const role = (persona.role || '').toLowerCase();
        return name.includes(query) || role.includes(query);
      });

      renderPersonaList(filtered);
    });
  }
});

// Add selected personas to conversation
async function addSelectedPersonas() {
  if (selectedPersonaIds.size === 0) {
    closePersonaSelectorDrawer();
    return;
  }

  // Get conversation ID from the page (should be set by parent template)
  const conversationId = window.conversationId;

  // Debug logging
  console.log('[Persona Drawer] Attempting to add personas. Conversation ID:', conversationId);
  console.log('[Persona Drawer] Conversation ID type:', typeof conversationId);

  if (!conversationId || conversationId === '') {
    console.error('[Persona Drawer] Cannot add personas - invalid conversation ID:', conversationId);
    alert('Error: No conversation ID found. Please refresh the page and try again.');
    closePersonaSelectorDrawer();
    return;
  }

  // Add each selected persona
  const promises = Array.from(selectedPersonaIds).map(personaId => {
    const formData = new FormData();
    formData.append('persona_id', personaId);

    return fetch(`/conversations/${conversationId}/participants/add`, {
      method: 'POST',
      body: formData
    });
  });

  try {
    await Promise.all(promises);

    // Clear selection
    selectedPersonaIds.clear();

    // Close drawer
    closePersonaSelectorDrawer();

    // Reload page to show new participants
    window.location.reload();
  } catch (error) {
    console.error('Error adding personas:', error);
    alert('Failed to add some personas. Please try again.');
  }
}

// Utility function to escape HTML
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Initialize existing personas (to be called from parent template)
function setExistingPersonas(personaIds) {
  existingPersonaIds = new Set(personaIds);
}
</script>
