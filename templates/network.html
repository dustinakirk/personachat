{% extends "base.html" %}

{% block title %}Persona Network - PersonaChat{% endblock %}

{% block content %}
<div class="network-container">
    <div class="network-sidebar">
        <h2>Network View</h2>

        <div class="controls">
            <button class="btn btn-small btn-primary" onclick="fitGraph()">
                <i class="icon-maximize"></i> Fit to Screen
            </button>
            <button class="btn btn-small btn-secondary" onclick="resetZoom()">
                <i class="icon-refresh"></i> Reset Zoom
            </button>
        </div>

        <div class="filters">
            <h3>Filters</h3>
            <div class="filter-group">
                <label>
                    <input type="checkbox" id="filter-manager" checked onchange="applyFilters()">
                    Manager
                </label>
                <label>
                    <input type="checkbox" id="filter-peer" checked onchange="applyFilters()">
                    Peer
                </label>
                <label>
                    <input type="checkbox" id="filter-collaborator" checked onchange="applyFilters()">
                    Collaborator
                </label>
                <label>
                    <input type="checkbox" id="filter-vendor" checked onchange="applyFilters()">
                    Vendor
                </label>
                <label>
                    <input type="checkbox" id="filter-customer" checked onchange="applyFilters()">
                    Customer
                </label>
                <label>
                    <input type="checkbox" id="filter-stakeholder" checked onchange="applyFilters()">
                    Stakeholder
                </label>
            </div>
        </div>

        <div class="selected-persona" id="selected-persona" style="display: none;">
            <h3>Selected Persona</h3>
            <div id="persona-details"></div>
            <div class="persona-actions">
                <button class="btn btn-small btn-primary" onclick="expandNetwork()">
                    Expand Network
                </button>
                <button class="btn btn-small btn-secondary" onclick="editPersona()">
                    Edit Persona
                </button>
            </div>
        </div>
    </div>

    <div class="network-canvas" id="cy"></div>
</div>

<style>
.network-container {
    display: flex;
    height: calc(100vh - 80px);
    gap: 0;
    margin: 0;
    max-width: none;
}

.network-sidebar {
    width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 1.5rem;
    overflow-y: auto;
}

.network-sidebar h2 {
    margin: 0 0 1.5rem 0;
}

.network-sidebar h3 {
    margin: 1.5rem 0 1rem 0;
    font-size: 1rem;
}

.controls {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
}

.filters {
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.filter-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.filter-group input[type="checkbox"] {
    cursor: pointer;
}

.selected-persona {
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    margin-top: 1.5rem;
}

#persona-details {
    background: var(--bg);
    padding: 1rem;
    border-radius: 6px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
}

#persona-details h4 {
    margin: 0 0 0.5rem 0;
    color: var(--accent);
}

#persona-details p {
    margin: 0.25rem 0;
    color: var(--text-dim);
}

.persona-actions {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.network-canvas {
    flex: 1;
    background: var(--bg);
}
</style>

<!-- Cytoscape.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>

<script>
let cy;
let selectedPersonaId = null;
const focalPersonaId = "{{ focal_persona_id or '' }}";

// Initialize network on page load
document.addEventListener('DOMContentLoaded', async () => {
    await loadNetworkData();
});

async function loadNetworkData() {
    try {
        const url = focalPersonaId
            ? `/network/data?persona_id=${focalPersonaId}`
            : '/network/data';

        const response = await fetch(url);
        const data = await response.json();

        if (data.success) {
            initializeGraph(data.elements);
        } else {
            alert('Error loading network: ' + data.error);
        }
    } catch (error) {
        alert('Error loading network: ' + error.message);
    }
}

function initializeGraph(elements) {
    cy = cytoscape({
        container: document.getElementById('cy'),

        elements: elements,

        style: [
            {
                selector: 'node',
                style: {
                    'background-color': '#5c7cfa',
                    'label': 'data(label)',
                    'text-valign': 'center',
                    'text-halign': 'center',
                    'color': '#ffffff',
                    'text-outline-width': 2,
                    'text-outline-color': '#0c111d',
                    'width': 60,
                    'height': 60,
                    'font-size': '12px',
                    'font-weight': 'bold'
                }
            },
            {
                selector: 'node:selected',
                style: {
                    'background-color': '#748ffc',
                    'border-width': 3,
                    'border-color': '#91a7ff'
                }
            },
            {
                selector: 'edge',
                style: {
                    'width': 2,
                    'line-color': '#495057',
                    'target-arrow-color': '#495057',
                    'target-arrow-shape': 'triangle',
                    'curve-style': 'bezier',
                    'label': 'data(label)',
                    'font-size': '10px',
                    'color': '#909296',
                    'text-rotation': 'autorotate',
                    'text-margin-y': -10
                }
            },
            {
                selector: 'edge.filtered',
                style: {
                    'display': 'none'
                }
            }
        ],

        layout: {
            name: 'cose',
            animate: true,
            animationDuration: 500,
            nodeRepulsion: 8000,
            idealEdgeLength: 100,
            edgeElasticity: 100,
            nestingFactor: 1.2,
            gravity: 1,
            numIter: 1000,
            initialTemp: 200,
            coolingFactor: 0.95,
            minTemp: 1.0
        },

        minZoom: 0.3,
        maxZoom: 3
    });

    // Node click event
    cy.on('tap', 'node', function(evt) {
        const node = evt.target;
        selectedPersonaId = node.id();
        showPersonaDetails(node);
    });

    // Edge click event (for editing relationships)
    cy.on('tap', 'edge', function(evt) {
        const edge = evt.target;
        const label = prompt('Enter new relationship label:', edge.data('label'));
        if (label) {
            updateRelationshipLabel(edge.id(), label);
        }
    });

    // Canvas click (deselect)
    cy.on('tap', function(evt) {
        if (evt.target === cy) {
            selectedPersonaId = null;
            document.getElementById('selected-persona').style.display = 'none';
        }
    });
}

function showPersonaDetails(node) {
    const data = node.data();
    const detailsDiv = document.getElementById('persona-details');
    const selectedDiv = document.getElementById('selected-persona');

    detailsDiv.innerHTML = `
        <h4>${data.label}</h4>
        <p><strong>Role:</strong> ${data.role || 'Not specified'}</p>
        ${data.company ? `<p><strong>Company:</strong> ${data.company}</p>` : ''}
    `;

    selectedDiv.style.display = 'block';
}

function fitGraph() {
    cy.fit();
}

function resetZoom() {
    cy.reset();
}

function applyFilters() {
    const filters = {
        manager: document.getElementById('filter-manager').checked,
        peer: document.getElementById('filter-peer').checked,
        collaborator: document.getElementById('filter-collaborator').checked,
        vendor: document.getElementById('filter-vendor').checked,
        customer: document.getElementById('filter-customer').checked,
        stakeholder: document.getElementById('filter-stakeholder').checked
    };

    cy.edges().forEach(edge => {
        const type = edge.data('relationship_type');
        if (filters[type]) {
            edge.removeClass('filtered');
        } else {
            edge.addClass('filtered');
        }
    });
}

async function expandNetwork() {
    if (!selectedPersonaId) return;

    try {
        const response = await fetch(`/network/expand/${selectedPersonaId}`);
        const data = await response.json();

        if (data.success && data.suggestions.length > 0) {
            // Show suggestions in a modal or redirect
            window.location.href = `/personas/${selectedPersonaId}/suggestions`;
        } else {
            alert('No expansion suggestions available');
        }
    } catch (error) {
        alert('Error expanding network: ' + error.message);
    }
}

function editPersona() {
    if (!selectedPersonaId) return;
    window.location.href = `/personas/${selectedPersonaId}/edit`;
}

async function updateRelationshipLabel(edgeId, newLabel) {
    try {
        const response = await fetch(`/network/relationships/${edgeId}/update`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ label: newLabel })
        });

        const data = await response.json();

        if (data.success) {
            // Update the edge label in the graph
            cy.getElementById(edgeId).data('label', newLabel);
        } else {
            alert('Error updating relationship: ' + data.error);
        }
    } catch (error) {
        alert('Error updating relationship: ' + error.message);
    }
}
</script>
{% endblock %}
